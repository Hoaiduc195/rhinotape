[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "llm-tape"
version = "0.2.0"
description = "Record, replay, and assert on LLM HTTP & SSE streaming calls (tokens, cost, tool calls) in pytest."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "llm-tape contributors" },
]
keywords = ["llm", "testing", "pytest", "vcr", "httpx", "sse", "openai", "anthropic", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Hoaiduc195/llm-tape"
Repository = "https://github.com/Hoaiduc195/llm-tape"
Issues = "https://github.com/Hoaiduc195/llm-tape/issues"
Changelog = "https://github.com/Hoaiduc195/llm-tape/blob/master/CHANGELOG.md"

[project.optional-dependencies]
pytest = ["pytest>=8.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
llm-tape = "llm_tape.cli:main"

[project.entry-points.pytest11]
llm_tape = "llm_tape.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
packages = ["llm_tape"]
mypy_path = "src"
