[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "llm-tape"
version = "0.1.0"
description = "Record, replay, and assert on LLM HTTP calls (tokens, cost, tool calls) in pytest."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "llm-tape contributors" },
]
keywords = ["llm", "testing", "pytest", "vcr", "httpx", "openai", "anthropic", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
pytest = ["pytest>=8.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
llm-tape = "llm_tape.cli:main"

[project.entry-points.pytest11]
llm_tape = "llm_tape.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_tape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
