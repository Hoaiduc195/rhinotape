- id: llm-tape-verify-secrets
  name: Verify llm-tape cassettes (schema + secrets)
  description: Validate .tape.json(.gz) cassettes and block leaked API keys or tokens.
  entry: llm-tape verify --check-secrets
  language: python
  files: \.tape\.json(\.gz)?$

- id: llm-tape-verify-pii
  name: Verify llm-tape cassettes (schema + secrets + PII)
  description: Validate .tape.json(.gz) cassettes and block leaked secrets or PII.
  entry: llm-tape verify --check-secrets --check-pii
  language: python
  files: \.tape\.json(\.gz)?$
