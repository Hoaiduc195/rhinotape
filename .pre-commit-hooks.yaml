- id: rhinotape-verify-secrets
  name: Verify rhinotape cassettes (schema + secrets)
  description: Validate .tape.json(.gz) cassettes and block leaked API keys or tokens.
  entry: rhinotape verify --check-secrets
  language: python
  files: \.tape\.json(\.gz)?$

- id: rhinotape-verify-pii
  name: Verify rhinotape cassettes (schema + secrets + PII)
  description: Validate .tape.json(.gz) cassettes and block leaked secrets or PII.
  entry: rhinotape verify --check-secrets --check-pii
  language: python
  files: \.tape\.json(\.gz)?$
