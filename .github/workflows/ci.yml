name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Lint & format check with ruff
        run: |
          uv run --python ${{ matrix.python-version }} ruff check src tests examples
          uv run --python ${{ matrix.python-version }} ruff format --check src tests examples

      - name: Type-check with mypy
        run: uv run --python ${{ matrix.python-version }} mypy

      - name: Run pytest with coverage
        run: |
          uv run --python ${{ matrix.python-version }} coverage run --source=rhinotape -m pytest -v -W error
          uv run --python ${{ matrix.python-version }} coverage report -m --fail-under=93

      - name: Dogfood rhinotape verify (secrets & PII)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv run --python ${{ matrix.python-version }} rhinotape verify . --check-secrets --check-pii

      - name: Build package
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: uv build

      - name: Verify wheel installs cleanly across optional extras
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          uv venv --python ${{ matrix.python-version }} .tmp-no-pytest-venv
          uv pip install --python .tmp-no-pytest-venv/bin/python dist/*.whl
          .tmp-no-pytest-venv/bin/python -c "import rhinotape; print(rhinotape.__version__)"
          .tmp-no-pytest-venv/bin/python - <<'PY'
          import httpx
          from rhinotape import MemoryCassetteStore, TapeMode, TapeSession

          store = MemoryCassetteStore()
          resp_payload = {
              "model": "gpt-4o-mini",
              "choices": [{"message": {"role": "assistant", "content": "pong"}}],
              "usage": {"prompt_tokens": 10, "completion_tokens": 5},
          }
          transport = httpx.MockTransport(lambda req: httpx.Response(200, json=resp_payload))
          with TapeSession("smoke.tape.json", mode=TapeMode.RECORD, store=store) as rec:
              with httpx.Client(transport=transport) as client:
                  r = client.post(
                      "https://api.openai.com/v1/chat/completions",
                      json={"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "ping"}]},
                  )
                  assert r.status_code == 200
              rec.assert_call_count(1)

          with TapeSession("smoke.tape.json", mode=TapeMode.REPLAY, store=store) as rep:
              with httpx.Client(
                  transport=httpx.MockTransport(lambda req: httpx.Response(500))
              ) as client:
                  r = client.post(
                      "https://api.openai.com/v1/chat/completions",
                      json={"model": "gpt-4o-mini", "messages": [{"role": "user", "content": "ping"}]},
                  )
                  assert r.status_code == 200
                  assert r.json()["choices"][0]["message"]["content"] == "pong"
              rep.assert_call_count(1)
              rep.assert_tokens_under(50)
          print("Offline wheel smoke test OK")
          PY
          .tmp-no-pytest-venv/bin/rhinotape --help
          rm -rf .tmp-no-pytest-venv
